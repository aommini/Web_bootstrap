<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านค้าออนไลน์ของฉัน</title>
    <!-- Tailwind CSS สำหรับตกแต่งให้สวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Kanit) -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">🛍️ My Shop</h1>
            <div class="flex items-center space-x-4">
                <button onclick="toggleCart()" class="bg-blue-700 hover:bg-blue-800 px-4 py-2 rounded-lg flex items-center space-x-2 transition">
                    <span>🛒 ตะกร้าสินค้า</span>
                    <span id="cart-count" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
     
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="menu-container"></div>
        <!-- Header Section -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold mb-2">สินค้าแนะนำทั้งหมด</h2>
            <p class="text-gray-600">เลือกซื้อสินค้าคุณภาพดี ราคาประหยัด ส่งตรงถึงบ้านคุณ</p>
        </div>

        <!-- Product Grid -->
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- สินค้าจะถูกเรนเดอร์ด้วย JavaScript ด้านล่าง -->
        </div>
    </main>

    <!-- Modal ตะกร้าสินค้าและการสั่งซื้อ -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
        <div class="bg-white w-full max-w-lg rounded-xl shadow-xl p-6 m-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-xl font-bold">🛒 ตะกร้าสินค้าของคุณ</h3>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
            </div>

            <!-- รายการสินค้าในตะกร้า -->
            <div id="cart-items" class="space-y-4 mb-4">
                <p class="text-gray-500 text-center py-4">ไม่มีสินค้าในตะกร้า</p>
            </div>

            <!-- ราคารวม -->
            <div class="border-t pt-4 mb-6">
                <div class="flex justify-between text-lg font-bold">
                    <span>ยอดรวมทั้งสิ้น:</span>
                    <span id="cart-total" class="text-blue-600">0 บาท</span>
                </div>
            </div>

            <!-- ฟอร์มข้อมูลการจัดส่ง -->
            <div class="border-t pt-4">
                <h4 class="font-bold mb-3">📦 ข้อมูลการจัดส่ง</h4>
                <form id="checkout-form" onsubmit="checkout(event)" class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600">ชื่อ-นามสกุล</label>
                        <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600">เบอร์โทรศัพท์</label>
                        <input type="tel" id="phone" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600">ที่อยู่จัดส่ง</label>
                        <textarea id="address" rows="2" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg transition">
                        ยืนยันการสั่งซื้อ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript สำหรับจัดการระบบร้านค้า -->
    <script>
        // ข้อมูลสินค้าจำลอง
        const products = [
            { id: 1, name: "หูฟังไร้สาย Bluetooth", price: 890, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" },
            { id: 2, name: "นาฬิกาสมาร์ทวอทช์", price: 1590, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60" },
            { id: 3, name: "กระเป๋าเป้สะพายหลัง", price: 650, image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&auto=format&fit=crop&q=60" },
            { id: 4, name: "รองเท้าผ้าใบแฟชั่น", price: 1200, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = [];

        // แสดงสินค้าลงในหน้าเว็บ
        function renderProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow hover:shadow-lg transition overflow-hidden flex flex-col justify-between">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-semibold text-lg mb-1">${product.name}</h3>
                            <p class="text-blue-600 font-bold text-xl mb-4">${product.price.toLocaleString()} บาท</p>
                        </div>
                        <button onclick="addToCart(${product.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition text-sm font-medium">
                            + เพิ่มลงตะกร้า
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // เพิ่มสินค้าลงตะกร้า
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            alert(`เพิ่ม "${product.name}" ลงในตะกร้าแล้ว`);
        }

        // อัปเดต UI ในตะกร้าสินค้า
        function updateCartUI() {
            const cartCount = document.getElementById('cart-count');
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');

            // นับจำนวนชิ้นรวม
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.innerText = totalCount;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-gray-500 text-center py-4">ไม่มีสินค้าในตะกร้า</p>`;
                cartTotal.innerText = `0 บาท`;
                return;
            }

            // แสดงรายการใน Modal
            cartItems.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center border-b pb-3">
                    <div>
                        <h5 class="font-medium">${item.name}</h5>
                        <p class="text-sm text-gray-500">${item.price.toLocaleString()} บาท x ${item.quantity}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="changeQuantity(${item.id}, -1)" class="bg-gray-200 px-2 rounded">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)" class="bg-gray-200 px-2 rounded">+</button>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 ml-2">🗑️</button>
                    </div>
                </div>
            `).join('');

            // คำนวณราคารวม
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotal.innerText = `${total.toLocaleString()} บาท`;
        }

        // เปลี่ยนแปลงจำนวนสินค้าในตะกร้า
        function changeQuantity(productId, amount) {
            const item = cart.find(p => p.id === productId);
            if (item) {
                item.quantity += amount;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCartUI();
                }
            }
        }

        // ลบสินค้าออกจากตะกร้า
        function removeFromCart(productId) {
            cart = cart.filter(p => p.id !== productId);
            updateCartUI();
        }

        // เปิด/ปิด ตะกร้าสินค้า
        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        // จำลองการสั่งซื้อสำเร็จ
        function checkout(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            
            alert(`ขอบคุณคุณ ${name} สั่งซื้อสินค้าเรียบร้อยแล้ว! (นี่คือเว็บไซต์ตัวอย่าง)`);
            
            // ล้างตะกร้าและปิด Modal
            cart = [];
            updateCartUI();
            toggleCart();
            document.getElementById('checkout-form').reset();
        }

        // โหลดรายการสินค้าเมื่อเปิดเว็บ
        renderProducts();
    </script>
</body>
</html>
