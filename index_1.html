    <div class="container">
        <h3 class="alert alert-success mt-4 text-center">หน้าหลัก</h3>
        <div class="alert alert-primary text-center" role="alert">
           Worayut Bnobut
        </div>
        <div class="text-end mb-4">
            <a class="btn btn-danger" href="https://www.google.com/webhp?hl=en&sa=X&ved=2ahUKEwiFiIrc89iWAxU7cWwGHczfEqAQPHoECAYQBA">google</a>
        </div>

            <!-- colum -->
    <div class="container text-center">
        <div class="row">
          <div class="col-sm-4 bg-primary">
           columns 1
            <img src="download.jpg" width="100%">
            cute
          </div>
          <div class="col-sm-4 bg-danger">
           columns 2
            <img  src="download_1.jpg" width="100%">
          </div>
          
          <div class="col-sm-4 text-bg-dark">
           <h4 class="mt-4">Register</h4>

           <form class="text-start ">

            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Fritname</label>
              <input type="text" class="form-control" id="Fritname" required placeholder="input Fritname">
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Lastname</label>
                <input type="text" class="form-control" id="Lastname" required required placeholder="input Lastname">
            </div>
        
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Telephone</label>
                <input type="tel" class="form-control" id="phone"  required required placeholder="ex. xxx-xxx-xxxx">
            </div>

        <div class="mb-3">
            <label class="form-label">Province</label>
            <select class="form-select " id="Province" required>
                
                <option selected>เลือกจังวัด</option>
                <option value="1">สระแก้ว</option>
                <option value="2">ชลบุรี</option>
                <option value="3">ระยอง</option>
              </select>
        </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="e-mail"  required  required required placeholder="input e-mail">
            </div>

            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password</label>
              <input type="password" class="form-control" id="pw" required required required placeholder="input password">
            </div>

            <!-- <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="exampleCheck1">
              <label class="form-check-label" for="exampleCheck1">Check me out</label>
            </div> -->

            <div class="text-center mb-4">  
                <button type="submit" class="btn btn-success">Submit</button>
                <button type="submit" class="btn btn-success">Cancel</button>
            </div>


          
          </form>
          </div>
        </div>
      </div>
