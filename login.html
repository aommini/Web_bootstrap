<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- นำเข้า Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center py-4 bg-body-tertiary" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <!-- Card สำหรับครอบฟอร์ม Login -->
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- หัวข้อฟอร์ม -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold fs-3">เข้าสู่ระบบ</h2>
                            <p class="text-muted small">กรุณากรอกข้อมูลเพื่อเข้าใช้งาน</p>
                        </div>

                        <!-- ฟอร์ม Login -->
                        <form>
                            <!-- ช่องกรอก Email / Username -->
                            <div class="mb-3">
                                <label for="email" class="form-label">อีเมลหรือชื่อผู้ใช้งาน</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>

                            <!-- ช่องกรอก Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">รหัสผ่าน</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>

                            <!-- ตัวเลือก Remember me และ Forgot password -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label small" for="rememberMe">จดจำฉันไว้</label>
                                </div>
                                <a href="#" class="small text-decoration-none">ลืมรหัสผ่าน?</a>
                            </div>

                            <!-- ปุ่ม Login -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary py-2 fw-semibold">เข้าสู่ระบบ</button>
                            </div>

                            <!-- ลิงก์สำหรับสมัครสมาชิก -->
                            <div class="text-center mt-4">
                                <p class="small text-muted">ยังไม่มีบัญชีใช่ไหม? <a href="#" class="text-decoration-none">สมัครสมาชิก</a></p>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- นำเข้า Bootstrap 5 JS Bundle (ไม่บังคับ แต่จำเป็นถ้าใช้ Component ที่ต้องมี JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
